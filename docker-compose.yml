# 镜像由推送到 master 的 GitHub Actions 发布到 GHCR。
# 标签是那次提交的完整 Git commit，启动时总是拉取这个标签。
services:
  chat-bridge:
    image: ghcr.io/yuuzao/chat-bridge:${GIT_COMMIT:?GIT_COMMIT is required}
    pull_policy: always
    user: "${HOST_UID:?HOST_UID is required}:${HOST_GID:?HOST_GID is required}"
    environment:
      LOG_LEVEL: INFO
      GIT_COMMIT: ${GIT_COMMIT:?GIT_COMMIT is required}
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    restart: "no"
