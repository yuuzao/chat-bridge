# 镜像由推送到 master 的 GitHub Actions 发布到 GHCR。
# 标签是那次提交的完整 Git commit，启动时总是拉取这个标签。
services:
  chat-bridge:
    image: ghcr.io/yuuzao/chat-bridge:${GIT_COMMIT:?GIT_COMMIT is required}
    pull_policy: always
    user: "${HOST_UID:?HOST_UID is required}:${HOST_GID:?HOST_GID is required}"
    environment:
      LOG_LEVEL: INFO
      GIT_COMMIT: ${GIT_COMMIT:?GIT_COMMIT is required}
    ports:
      # 默认仅绑定本机回环供 Caddy 等反向代理转发，避免明文 HTTP 暴露到公网。
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.yaml:/config.yaml:ro
      # SQLite 数据库持久化目录（需归属 HOST_UID:HOST_GID 可写）。
      # 必须挂目录而不是单个文件，WAL 日志（-wal / -shm）要在同一目录里创建。
      # config.yaml 里的 db_path 对应 /data/chat-bridge.db。
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    # 留足优雅退出窗口，确保重启或重建容器时完成 SQLite WAL checkpoint 落盘。
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
