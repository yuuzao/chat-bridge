# Chat Bridge 配置示例。
# 程序不会读取本文件，也不会为任何字段填默认值。
# 复制为 config.yaml 后填写。config.yaml 含认证密钥，不要提交到仓库。

# 作用：HTTP 监听地址，原样交给 net.Listen。
# 是否必填：必填。
# 默认值：无。缺失或空字符串时进程启动失败。
# 合法取值：net.Listen 接受的 TCP 地址，例如 "127.0.0.1:8080"、":8080"。
listen_addr: "127.0.0.1:8080"

# 作用：本服务全部接口使用的共享密钥。创建和回调可以放在请求头 X-Auth-Token，也可以放在 JSON 或表单字段 auth_token。
# 是否必填：必填。
# 默认值：无。缺失或空字符串时进程启动失败。
# 合法取值：非空字符串。程序不做去空格处理。
auth_token: "replace-me"

# 作用：任务创建后，服务端把查询 POST 到这个完整地址。
# 是否必填：必填。
# 默认值：无。缺失或空字符串时进程启动失败。
# 合法取值：带主机名的 http 或 https URL。不允许用户信息、片段和空白字符。查询字符串可以保留。
bot_url: "http://127.0.0.1:9/bot"

# 作用：转发到 Bot 时，请求头 Authorization 使用的密钥。程序会写成 "Bearer <这个值>"。
# 是否必填：必填。
# 默认值：无。缺失、空字符串或含空白时进程启动失败。
# 合法取值：非空、不含空白。不要自己写 Bearer 前缀。
bot_bearer_token: "replace-me"

# 作用：单次入站请求体的最大字节数，同时限制丢弃 Bot 响应体时的读取上限。
# 是否必填：必填。
# 默认值：无。缺失、0 或负数时进程启动失败。
# 合法取值：正整数，单位是字节。
max_body_bytes: 10485760

# 作用：任务自创建起超过该秒数后，后台清理从内存删除该任务。
# 是否必填：必填。
# 默认值：无。缺失、0 或负数时进程启动失败。
# 合法取值：正整数秒，且换算后的时长不超过 time.Duration 上限。
task_ttl_seconds: 300

# 作用：向 Bot 转发请求的整体超时。超时后任务记为 FAILED。
# 是否必填：必填。
# 默认值：无。缺失、0 或负数时进程启动失败。
# 合法取值：正整数秒，且换算后的时长不超过 time.Duration 上限。
forward_timeout_seconds: 30

# 作用：后台扫描过期任务的周期。
# 是否必填：必填。
# 默认值：无。缺失、0 或负数时进程启动失败。
# 合法取值：正整数秒，且换算后的时长不超过 time.Duration 上限。
cleanup_interval_seconds: 30
